<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Simulaciones Cartones América</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,300;0,400;0,500;0,700;1,700&display=swap">
<style>
  /* Layout: cabecera violeta con foto tratada, logo y pestañas; espacio de trabajo gris claro con superficies blancas y rejilla 2/3 columnas que colapsa a 1 en móvil. */
  :root{
    --violet:#1B1C28; --white:#FFFFFF; --light:#F2F2F2; --gray:#D3D3D3;
    --v80:rgba(27,28,40,0.8); --v70:rgba(27,28,40,0.7); --v15:rgba(27,28,40,0.15); --v08:rgba(27,28,40,0.08); --w70:rgba(255,255,255,0.72); --w30:rgba(255,255,255,0.3);
    --accent:#4B3BEF; --accent-dk:#2E22B8; --accent-md:#8C83F4; --accent-lt:#E4E1FD; --accent-xl:#F3F1FE;
    --font:'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
    color-scheme: light;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font); color:var(--violet); background:var(--light); line-height:1.55; font-size:14px; font-weight:400;}
  b,strong{font-weight:700;}
  header.top{background:var(--violet); color:var(--white);}
  .in{max-width:1280px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
  .hero{background-size:cover; background-position:center 40%; position:relative;}
  .hero::before{content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(27,28,40,0.88) 0%, rgba(27,28,40,0.62) 55%, rgba(27,28,40,0.35) 100%);}
  .hero .in{position:relative; padding-block:28px 34px;}
  .logo{display:block; width:170px; height:auto; margin:0 0 34px;}
  .eyebrow{font-size:11.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--white);}
  header h1{font-size:clamp(26px, 4vw, 40px); font-weight:300; line-height:1.15; margin:8px 0 8px; text-wrap:balance; color:var(--white);}
  header .sub{font-size:15px; font-weight:500; color:var(--w70);}
  .tabsbar{border-top:1px solid var(--w30);}
  .maintabs{display:flex; flex-wrap:wrap; gap:4px 28px;}
  .maintabs button{background:transparent; border:none; border-bottom:1px solid transparent; padding:14px 0 13px; font:inherit; font-size:14px; font-weight:400; color:var(--w70); cursor:pointer;}
  .maintabs button.active{color:var(--white); font-weight:700; border-bottom-color:var(--white);}
  .maintabs button:hover{color:var(--white);}
  .wrap{max-width:1280px; margin:0 auto; padding-block:8px 64px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
  .subtabs{display:flex; flex-wrap:wrap; gap:8px; margin:24px 0 12px;}
  .subtabs button{background:var(--white); border:1px solid var(--accent); color:var(--accent); padding:8px 18px; border-radius:999px; font:inherit; font-size:13px; font-weight:500; cursor:pointer;}
  .subtabs button.active{background:var(--accent); color:var(--white);}
  .subtabs button:hover{background:var(--accent-xl);} .subtabs button.active:hover{background:var(--accent-dk);}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .maintabs button:focus-visible{outline-color:var(--white);}
  h2.sec{font-size:24px; font-weight:300; line-height:1.25; margin:14px 0 6px; text-wrap:balance;}
  p.note{font-size:14px; color:var(--v80); margin-bottom:18px; max-width:880px;}
  .kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin:18px 0 24px;}
  .kpi{background:var(--white); border:1px solid var(--v15); border-top:3px solid var(--accent); border-radius:8px; padding:16px 18px; min-width:0;}
  .kpi .n{font-size:27px; font-weight:700; color:var(--accent); line-height:1.05; letter-spacing:-0.01em; font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:13px; font-weight:500; margin-top:10px; padding-top:10px; border-top:1px solid var(--v15);}
  .kpi .s{font-size:12px; color:var(--v70); margin-top:2px;}
  .grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-bottom:24px;}
  .grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:24px;}
  .grid2.mt{margin-top:24px;}
  .panelbox{background:var(--white); border:1px solid var(--v15); border-radius:8px; padding:18px 20px; min-width:0;}
  .panelbox h3{font-size:14.5px; font-weight:500; color:var(--accent-dk); margin-bottom:14px;}
  .ptext{font-size:13.5px;}
  .pnote{font-size:12.5px; color:var(--v70); margin-top:10px;}
  .plist{list-style:none; display:grid; gap:8px; font-size:13.5px;}
  .plist li{padding-left:16px; position:relative;}
  .plist li::before{content:""; position:absolute; left:0; top:8px; width:6px; height:6px; border-radius:50%; background:var(--accent);}
  code{font-size:12px; background:var(--accent-xl); padding:1px 6px; border-radius:4px; border:1px solid var(--v15);}
  .chartwrap{position:relative; height:280px;}
  .chartwrap.xtall{height:760px;}
  .tscroll{overflow-x:auto; margin:6px 0 20px; border-radius:8px; border:1px solid var(--v15);}
  table{width:100%; border-collapse:collapse; background:var(--white); font-size:13px;}
  th{background:var(--accent); color:var(--white); padding:10px 12px; text-align:left; font-size:12px; font-weight:500; white-space:nowrap;}
  th.num,td.num{text-align:right; font-variant-numeric:tabular-nums;}
  td{padding:9px 12px; border-top:1px solid var(--v08); vertical-align:top;}
  td.b{font-weight:700; white-space:nowrap;}
  tbody tr:nth-child(even) td{background:var(--accent-xl);}
  table.diff td:nth-child(3){font-weight:500; border-left:1px solid var(--accent-md); background:var(--accent-lt);}
  table.diff th:nth-child(3){background:var(--accent-dk);}
  tr.total td{font-weight:700; color:var(--accent-dk); background:var(--accent-lt) !important; border-top:1px solid var(--accent);}
  .callout{background:var(--violet); color:var(--white); padding:18px 22px; border-radius:8px; font-size:14px; margin:6px 0 26px;}
  .callout b{color:var(--white);}
  .tablecap{color:var(--accent-dk); font-size:11.5px; margin:22px 0 8px; text-transform:uppercase; letter-spacing:0.1em;}
  .tablecap.first{margin-top:28px;}
  .pill{display:inline-block; font-size:12px; font-weight:500; padding:3px 12px; border-radius:999px; white-space:nowrap; background:var(--accent); color:var(--white);}
  .sw{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:8px; vertical-align:-1px;}
  .mapgrid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:16px; align-items:start;}
  .mapbox{padding:10px;}
  .mapsvg{width:100%; height:auto; display:block;}
  .mapsvg .zpt{transition:opacity .2s;}
  .mapsvg .off{opacity:0.06;}
  .legend{display:grid; gap:8px;}
  .lg{display:flex; align-items:center; gap:4px; width:100%; background:var(--white); border:1px solid var(--accent-md); border-radius:8px; padding:10px 14px; font:inherit; font-size:13.5px; color:var(--violet); cursor:pointer; text-align:left; min-height:44px;}
  .lg .lgn{margin-left:auto; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums;}
  .lg[aria-pressed="false"]{opacity:0.4;}
  .timeline{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:0; margin:8px 0 24px; background:var(--white); border:1px solid var(--v15); border-radius:8px;}
  .tl{padding:14px 16px; min-width:0; border-left:1px solid var(--v15);}
  .tl:first-child{border-left:none; background:var(--accent-xl); border-radius:8px 0 0 8px;}
  .tlh{font-size:11.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--accent);}
  .tlt{font-size:18px; font-weight:700; margin:4px 0; font-variant-numeric:tabular-nums;}
  .tlv{font-size:12.5px; color:var(--v70);}
  footer{background:var(--violet); color:var(--w70);}
  footer .in{padding-block:20px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px;}
  @media(max-width:900px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr));} .grid2,.grid3,.mapgrid{grid-template-columns:1fr;} .timeline{grid-template-columns:repeat(2,minmax(0,1fr));} .tl{border-left:none; border-top:1px solid var(--v15);} .maintabs{gap:2px 20px;} }
  @media(max-width:480px){ .kpi .n{font-size:22px;} .chartwrap.xtall{height:680px;} .logo{width:140px; margin-bottom:24px;} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  [hidden]{display:none !important;}
  .gate{margin-top:26px; display:grid; gap:10px; max-width:520px;}
  .gate label{font-size:14px; font-weight:500; color:var(--white);}
  .gaterow{display:flex; gap:10px; flex-wrap:wrap;}
  .gate input{flex:1 1 220px; min-width:0; height:48px; border-radius:999px; border:1px solid var(--white); background:var(--white); color:var(--violet); padding:0 20px; font:inherit; font-size:15px;}
  .gate input:focus-visible{outline:2px solid var(--white); outline-offset:3px;}
  .cta{display:inline-flex; align-items:center; gap:14px; height:48px; padding:0 6px 0 22px; border-radius:999px; border:1px solid var(--accent); background:var(--accent); color:var(--white); font:inherit; font-size:14.5px; font-weight:500; cursor:pointer;}
  .cta-dot{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:50%; background:var(--white);}
  .cta:focus-visible{outline:2px solid var(--white); outline-offset:3px;}
  .gatemsg{min-height:20px; font-size:13px; color:var(--white);}
  .tabband{background:var(--violet); color:var(--white);}
</style>

function renderVisible(){
  if (typeof Chart === 'undefined') return;
  Object.keys(CFG).forEach(function(id){
    var el = document.getElementById(id);
    if (!el || el.offsetParent === null) return;
    if (made[id]) { made[id].resize(); return; }
    made[id] = new Chart(el, CFG[id]);
  });
}
document.querySelectorAll('.maintabs, .subtabs').forEach(function(tabs){
  var group = tabs.getAttribute('data-group');
  var btns = tabs.querySelectorAll('button[data-target]');
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      btns.forEach(function(x){ x.classList.remove('active'); x.setAttribute('aria-selected','false'); });
      b.classList.add('active'); b.setAttribute('aria-selected','true');
      document.querySelectorAll('[data-panel="'+group+'"]').forEach(function(p){ p.hidden = true; });
      document.getElementById(b.dataset.target).hidden = false;
      if (group === 'main') { try { history.replaceState(null, '', '#' + b.dataset.target); } catch(e) {} }
      setTimeout(renderVisible, 20);
    });
  });
});
document.querySelectorAll('.lg').forEach(function(b){
  b.addEventListener('click', function(){
    var on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
    document.querySelectorAll('.mapsvg .z-' + b.dataset.z).forEach(function(el){ el.classList.toggle('off', !on); });
  });
});

function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function unlock(pass){
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  var buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(ENC.iv) }, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(buf));
}
document.getElementById('gate').addEventListener('submit', async function(e){
  e.preventDefault();
  var msg = document.getElementById('gatemsg'), pw = document.getElementById('pw');
  var val = (pw.value || '').trim().toLowerCase();
  if (!val) { msg.textContent = 'Escribe la clave para continuar.'; pw.focus(); return; }
  msg.textContent = 'Abriendo el reporte…';
  try {
    var res = await unlock(val);
    var app = document.getElementById('app');
    app.innerHTML = res.html; app.hidden = false;
    document.getElementById('gate').hidden = true;
    boot(res.data);
  } catch (err) {
    msg.textContent = 'La clave no es correcta. Revísala e intenta de nuevo.';
    pw.select();
  }
});
